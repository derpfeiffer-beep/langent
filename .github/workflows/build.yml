name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Langent.sln

      - name: Build
        run: dotnet build Langent.sln -c Release --no-restore

      - name: Test
        run: dotnet test Langent.sln -c Release --no-build
